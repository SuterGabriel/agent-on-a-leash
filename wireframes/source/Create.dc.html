<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>1 · Create leash</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;background:#e9e9e9;color:#1c1c1c}
button,textarea,input{font-family:inherit}
a{color:#1c1c1c}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 393px; height: 852px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; color: #1c1c1c; font-family: 'IBM Plex Sans', system-ui, sans-serif; position: relative; overflow: hidden">
<main style="padding: 28px 20px 20px; display: flex; flex-direction: column; gap: 18px; flex: 1 1 0">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 26px; line-height: 1.2; font-weight: 600">Your agent’s leash</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #4f4f4f">Tell your agent what it may buy, in your own words.</p>
</div>
<div style="display: flex; gap: 10px; align-items: flex-start">
<textarea aria-label="Your instruction" placeholder="For example: Order our groceries, max CHF 120 per order…" style="flex: 1 1 0; height: 168px; box-sizing: border-box; padding: 14px; border: 1.5px solid #8f8f8f; border-radius: 12px; font-size: 15px; line-height: 1.45; color: #1c1c1c; background: #ffffff; resize: none"></textarea>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 64px">
<button aria-label="Speak your instruction" style="width: 52px; height: 52px; border-radius: 26px; border: 1.5px solid #1c1c1c; background: #1c1c1c; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg></button>
<span style="font-size: 12px; font-weight: 500; color: #3d3d3d">{{micState}}</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; color: #5c5c5c">Or start from an example</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button style="padding: 9px 14px; border: 1px solid #a8a8a8; border-radius: 999px; background: #ffffff; font-size: 14px; color: #1c1c1c">Groceries with weekly budget</button>
<button style="padding: 9px 14px; border: 1px solid #a8a8a8; border-radius: 999px; background: #ffffff; font-size: 14px; color: #1c1c1c">One item with return terms</button>
<button style="padding: 9px 14px; border: 1px solid #a8a8a8; border-radius: 999px; background: #ffffff; font-size: 14px; color: #1c1c1c">Clothing from shops I know</button>
</div>
</div>
<div style="display: flex; flex-direction: column; border: 1px solid #d6d6d6; border-radius: 12px">
<div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #e6e6e6">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="2"></rect><path d="M2.5 10h19"></path></svg>
<span style="flex: 1 1 0; font-size: 14px">Credit Card Gold CHF · Max Mustermann</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="8" width="14" height="11" rx="3"></rect><path d="M12 8V5"></path><circle cx="12" cy="4" r="1"></circle><path d="M9.5 13v1M14.5 13v1"></path></svg>
<span style="flex: 1 1 0; font-size: 14px">Shopping agent · token off</span>
</div>
</div>
<a href="Understood.dc.html" style="margin-top: auto; height: 52px; border-radius: 12px; background: #1c1c1c; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">Build my leash</a>
</main>
<nav aria-label="App tabs" style="flex-shrink: 0; height: 82px; box-sizing: border-box; padding: 8px 8px 24px; border-top: 1px solid #d6d6d6; background: #f7f7f7; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #6b6b6b"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="2"></rect><path d="M2.5 10h19"></path></svg><span>Card</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #6b6b6b"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg><span>Cockpit</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #6b6b6b"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20v-8M12 20V5M19 20v-12"></path></svg><span>Analytics</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #1c1c1c; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="7.5" r="3.5"></circle><path d="M10 10l5.5 5.5"></path><path d="M14 18.5l4.5-4.5 2 2-4.5 4.5z"></path></svg><span>Leash</span></div>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"micState":{"editor":"enum","options":["Listening","Thinking","Speaking"],"default":"Listening"},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
renderVals() {
return { micState: this.props.micState ?? 'Listening' };
}
}
</script>
</body>
</html>
